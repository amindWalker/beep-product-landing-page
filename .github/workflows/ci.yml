name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Use the native ARM runner for Ubuntu 26.04 (currently a public preview)
    runs-on: ubuntu-26.04-arm
    name: Build (ARM64) # <--- This is the name you'll add to your Ruleset

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # Or pin to a specific version like '1.1.x'
          cache: true # Automatically caches bun dependencies and lockfile

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Astro check
        run: bunx astro check

      - name: Build site
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
